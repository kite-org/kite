name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

env:
  IMAGE_NAME: kite
  GO_VERSION: "1.26"
  NODE_VERSION: "24"

jobs:
  # Push image to GitHub Packages.
  # See also https://docs.docker.com/docker-hub/builds/
  push:
    runs-on: ubuntu-latest
    if: ${{ github.repository_owner == 'kite-org' }}
    permissions:
      packages: write
      contents: write
    outputs:
      tag_name: ${{ steps.check_version.outputs.tag_name }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Login to Docker hub Registry
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: ui/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      - name: Install deps
        run: make deps

      - name: Check version
        id: check_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

      - name: Build
        run: make cross-compile

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile.binary
          push: true
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.check_version.outputs.tag_name }}
            zzde/${{ env.IMAGE_NAME }}:${{ steps.check_version.outputs.tag_name }}
            ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
            zzde/${{ env.IMAGE_NAME }}:latest
          labels: runnumber=${{ github.run_id }}

      - name: Login Helm to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Package Helm chart
        run: |
          helm package charts/kite/

      - name: Push Helm chart to OCI registry
        run: |
          CHART_PACKAGE=$(ls kite-*.tgz)
          helm push "$CHART_PACKAGE" oci://ghcr.io/${{ github.repository_owner }}/charts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.check_version.outputs.tag_name }}
          name: ${{ steps.check_version.outputs.tag_name }}
          draft: true
          prerelease: false
          generate_release_notes: true
          files: |
            kite-*.tgz
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  desktop:
    name: Desktop (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    needs: push
    if: ${{ github.repository_owner == 'kite-org' }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS
            os: macos-latest
            platform: darwin/arm64
            output: darwin-arm64
          - name: Windows
            os: ubuntu-latest
            platform: windows/amd64
            output: windows-amd64
    steps:
      - name: Checkout desktop branch
        uses: actions/checkout@v5
        with:
          ref: desktop

      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: ui/pnpm-lock.yaml
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Install desktop dependencies
        run: pnpm --dir ui install --frozen-lockfile

      - name: Install NSIS
        if: matrix.name == 'Windows'
        run: sudo apt-get update && sudo apt-get install -y nsis zip unzip

      - name: Prepare update notes
        env:
          RELEASE_TAG: ${{ needs.push.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          notes="$RUNNER_TEMP/kite-desktop-changelog.md"
          printf '## %s\n\n' "${RELEASE_TAG#v}" > "$notes"
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body | sed 's/^## /### /' >> "$notes"
          printf '\n[Release on GitHub](%s/%s/releases/tag/%s)\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$RELEASE_TAG" >> "$notes"
          echo "KITE_DESKTOP_CHANGELOG=$notes" >> "$GITHUB_ENV"

      - name: Build desktop packages and signed updates
        env:
          RELEASE_TAG: ${{ needs.push.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
          MYGO_UPDATER_PRIVATE_KEY: ${{ secrets.MYGO_UPDATER_PRIVATE_KEY }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          test -n "$MYGO_UPDATER_PRIVATE_KEY"
          export KITE_DESKTOP_VERSION="${RELEASE_TAG#v}"
          export GOFLAGS="-tags=desktop"
          export MYGO_LDFLAGS="-X github.com/zxh326/kite/pkg/version.Version=$KITE_DESKTOP_VERSION -X github.com/zxh326/kite/pkg/version.BuildDate=$(date -u +%Y-%m-%dT%H:%M:%SZ) -X github.com/zxh326/kite/pkg/version.CommitID=$(git rev-parse HEAD)"
          make frontend
          go run github.com/egoist/mygo/cmd/mygo generate
          make frontend
          go run github.com/egoist/mygo/cmd/mygo build -platform "$PLATFORM"

      - name: Prepare desktop release assets
        env:
          RELEASE_TAG: ${{ needs.push.outputs.tag_name }}
          PLATFORM: ${{ matrix.output }}
        run: |
          version="${RELEASE_TAG#v}"
          stage="$RUNNER_TEMP/kite-desktop-release"
          output="bin/desktop/$PLATFORM"
          mkdir -p "$stage"
          if [[ "$PLATFORM" == darwin-arm64 ]]; then
            cp "$output/kite-$version-arm64.dmg" "$stage/kite-darwin-arm64.dmg"
          else
            cp "$output/kite-setup-$version-amd64.exe" "$stage/kite-windows-amd64.exe"
            (cd "$output" && zip -q -T "$stage/kite-windows-amd64.zip" Kite.exe ghostty-vt.dll)
          fi
          cp "$output/update-$PLATFORM.json" "$output/kite-$version-$PLATFORM.tar.gz" "$stage/"
          for delta in "$output"/*.delta; do
            if [ -f "$delta" ]; then cp "$delta" "$stage/"; fi
          done

      - name: Add desktop assets to the release
        env:
          RELEASE_TAG: ${{ needs.push.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          stage="$RUNNER_TEMP/kite-desktop-release"
          gh release upload "$RELEASE_TAG" "$stage"/kite-* --repo "$GITHUB_REPOSITORY" --clobber
          gh release upload "$RELEASE_TAG" "$stage"/update-*.json --repo "$GITHUB_REPOSITORY" --clobber

  update-helm-index:
    runs-on: ubuntu-latest
    needs: push
    if: ${{ github.repository_owner == 'kite-org' && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v5
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Download release assets
        run: |
          TAG_NAME=${{ needs.push.outputs.tag_name }}
          VERSION=$(echo $TAG_NAME | sed 's/^v//')

          # Download the helm chart from the release
          gh release download $TAG_NAME --pattern "kite-$VERSION.tgz"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update Helm index
        run: |
          TAG_NAME=${{ needs.push.outputs.tag_name }}
          VERSION=$(echo $TAG_NAME | sed 's/^v//')

          # Set the repository URL for the helm chart
          REPO_URL="https://github.com/${{ github.repository }}/releases/download/$TAG_NAME"

          # Update index.yaml
          if [ -f index.yaml ]; then
            helm repo index . --url $REPO_URL --merge index.yaml
          else
            helm repo index . --url $REPO_URL
          fi

      - name: Commit and push index.yaml
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

          git add index.yaml
          if ! git diff --cached --quiet; then
            git commit -m "Update Helm index for ${{ needs.push.outputs.tag_name }}"
            git push
          else
            echo "No changes to commit"
          fi
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
