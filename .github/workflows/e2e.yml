name: E2E

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "internal/**"
      - "pkg/**"
      - "ui/**"
      - "e2e/**"
      - "scripts/e2e-start-app.sh"
      - "scripts/get-version.sh"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/e2e.yml"
      - "Makefile"
      - "go.mod"
      - "go.sum"
      - "*.go"
      - "internal/**"
      - "pkg/**"
      - "ui/**"
      - "e2e/**"
      - "scripts/e2e-start-app.sh"
      - "scripts/get-version.sh"

env:
  GO_VERSION: "1.25"
  NODE_VERSION: "24"

jobs:
  e2e:
    name: E2E
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      KITE_E2E_CLUSTER_NAME: kite-e2e
      KUBECONFIG: ${{ github.workspace }}/kite-e2e.kubeconfig
      KIND_LOGS_DIR: ${{ github.workspace }}/kind-logs
      KITE_E2E_PORT: "38080"
      KITE_E2E_LDAP_URL: ldap://127.0.0.1:3389
      KITE_E2E_OAUTH_ISSUER: http://127.0.0.1:5556

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "pnpm"
          cache-dependency-path: |
            ui/pnpm-lock.yaml
            e2e/pnpm-lock.yaml

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true
          check-latest: true

      - name: Install deps
        run: make deps

      - name: Install kind
        run: |
          [ "$(uname -m)" = "x86_64" ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-amd64
          [ "$(uname -m)" = "aarch64" ] && curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.31.0/kind-linux-arm64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Start external auth services
        run: |
          docker network create kite-e2e-auth

          docker run -d --name kite-e2e-ldap \
            --network kite-e2e-auth \
            --network-alias ldap \
            -p 3389:389 \
            -e LDAP_ORGANISATION="Kite E2E" \
            -e LDAP_DOMAIN="kite.test" \
            -e LDAP_ADMIN_PASSWORD="admin" \
            -e LDAP_CONFIG_PASSWORD="admin" \
            -e LDAP_TLS="false" \
            -v "${GITHUB_WORKSPACE}/e2e/fixtures/openldap:/container/service/slapd/assets/config/bootstrap/ldif/custom:ro" \
            osixia/openldap:1.5.0 --copy-service

          for i in $(seq 1 60); do
            if docker exec kite-e2e-ldap ldapsearch -x -H ldap://localhost:389 -b dc=kite,dc=test -D "cn=admin,dc=kite,dc=test" -w admin >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done

          docker exec kite-e2e-ldap ldapsearch -x -H ldap://localhost:389 -b dc=kite,dc=test -D "cn=admin,dc=kite,dc=test" -w admin >/dev/null

          docker run -d --name kite-e2e-dex \
            --network kite-e2e-auth \
            -p 5556:5556 \
            -v "${GITHUB_WORKSPACE}/e2e/fixtures/dex/config.yaml:/etc/dex/config.yaml:ro" \
            ghcr.io/dexidp/dex:v2.45.1 dex serve /etc/dex/config.yaml

          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:5556/.well-known/openid-configuration >/dev/null; then
              break
            fi
            sleep 1
          done

          curl -fsS http://127.0.0.1:5556/.well-known/openid-configuration >/dev/null

      - name: Run E2E tests
        run: make e2e-test

      - name: Export kind logs
        if: always()
        run: kind export logs "${KIND_LOGS_DIR}" --name "${KITE_E2E_CLUSTER_NAME}"

      - name: Collect external auth logs
        if: always()
        run: |
          docker logs kite-e2e-ldap > "${GITHUB_WORKSPACE}/kite-e2e-ldap.log" 2>&1 || true
          docker logs kite-e2e-dex > "${GITHUB_WORKSPACE}/kite-e2e-dex.log" 2>&1 || true

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e/playwright-report
            e2e/test-results
            ${{ env.KIND_LOGS_DIR }}
            ${{ github.workspace }}/kite-e2e-ldap.log
            ${{ github.workspace }}/kite-e2e-dex.log
