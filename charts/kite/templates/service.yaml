apiVersion: v1
kind: Service
metadata:
  name: {{ include "kite.fullname" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- merge (deepCopy (.Values.service.labels | default dict)) (include "kite.labels" . | fromYaml) | toYaml | nindent 4 }}
  {{- with .Values.service.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  type: {{ .Values.service.type }}
  {{- if (.Values.service.ipDualStack | default dict).enabled }}
  {{- with .Values.service.ipDualStack.ipFamilies }}
  ipFamilies:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ipFamilyPolicy: {{ .Values.service.ipDualStack.ipFamilyPolicy | default "PreferDualStack" }}
  {{- end }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "kite.selectorLabels" . | nindent 4 }}
