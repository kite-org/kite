{{- if .Values.gateway.enabled -}}
{{- if .Values.gateway.create }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name | default (include "kite.fullname" .) }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "kite.labels" . | nindent 4 }}
  {{- with .Values.gateway.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  gatewayClassName: {{ .Values.gateway.className | required "gateway.className is required when gateway.enabled is true" }}
  {{- with .Values.gateway.listeners }}
  listeners:
    {{- range . }}
    - name: {{ .name }}
      port: {{ .port }}
      protocol: {{ .protocol }}
      {{- with .hostname }}
      hostname: {{ . | quote }}
      {{- end }}
      {{- with .allowedRoutes }}
      allowedRoutes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- if eq .protocol "HTTPS" }}
      {{- with .tls }}
      tls:
        {{- if .mode }}
        mode: {{ .mode }}
        {{- end }}
        {{- with .certificateRefs }}
        certificateRefs:
          {{- toYaml . | nindent 10 }}
        {{- end }}
      {{- end }}
      {{- end }}
    {{- end }}
  {{- end }}
{{- end }}
{{- range .Values.gateway.httpRoutes }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .name | required "httpRoute name is required" }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "kite.labels" $ | nindent 4 }}
  {{- with .annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - name: {{ if not $.Values.gateway.create }}{{ $.Values.gateway.name | required "gateway.name is required when gateway.create is false" }}{{ else }}{{ $.Values.gateway.name | default (include "kite.fullname" $) }}{{ end }}
      {{- if and (not $.Values.gateway.create) $.Values.gateway.namespace }}
      namespace: {{ $.Values.gateway.namespace }}
      {{- end }}
  {{- with .hostnames }}
  hostnames:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  rules:
    {{- range .rules }}
    - matches:
        {{- range .matches }}
        {{- if or .path .headers .queryParams .method }}
        - {{- if .path }}
          path:
            type: {{ .path.type | default "PathPrefix" }}
            value: {{ .path.value | default "/" }}
          {{- end }}
          {{- with .headers }}
          headers:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .queryParams }}
          queryParams:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .method }}
          method: {{ . }}
          {{- end }}
        {{- end }}
        {{- end }}
      backendRefs:
        - name: {{ include "kite.fullname" $ }}
          port: {{ $.Values.service.port }}
      timeouts:
        request: {{ if .timeouts }}{{ .timeouts.request | default "900s" }}{{ else }}"900s"{{ end }}
    {{- end }}
{{- end }}
{{- end }}
